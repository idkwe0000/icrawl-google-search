[package]
name = "icrawl-google-search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
fastrand = "2.3.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json", "query"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
tokio = { version = "1.49.0", features = ["full"] }
